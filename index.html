<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log WEDM</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta
      name="theme-color"
      content="#e9eefb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#06080f"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Log WEDM" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // mode glass: auto ringan di HP dengan RAM <= 4 GB, bisa diganti manual lewat tombol ✦
      try {
        var g = localStorage.getItem("glass"),
          m = navigator.deviceMemory;
        if (g === "lite" || (g === null && m && m <= 4))
          document.documentElement.classList.add("lite");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrap">
      <!-- LOGIN -->
      <div id="login" class="card hide">
        <h1>Log WEDM</h1>
        <p class="mut">Login dulu bro</p>
        <label for="em">Email</label>
        <input id="em" type="email" autocomplete="username" />
        <label for="pw" class="mt8">Password</label>
        <input id="pw" type="password" autocomplete="current-password" />
        <button class="p w100 mt12" id="btnLogin">Masuk</button>
        <div class="mt10">
          <a href="#" id="lnkForgot" class="lnk">Lupa password?</a>
        </div>
        <div id="msg"></div>
      </div>

      <!-- SET PASSWORD BARU (dari link reset email) -->
      <div id="recover" class="card hide">
        <h1>Password baru</h1>
        <p class="mut">Masukkan password baru kamu</p>
        <label for="np1">Password baru</label>
        <input id="np1" type="password" autocomplete="new-password" />
        <label for="np2" class="mt8">Ulangi password</label>
        <input id="np2" type="password" autocomplete="new-password" />
        <button class="p w100 mt12" id="btnNewPw">Simpan password</button>
        <div id="msg2"></div>
      </div>

      <!-- APP -->
      <div id="app" class="hide">
        <header>
          <h1>Log Pengerjaan WEDM</h1>
          <div>
            <span class="mut" id="who"></span>
            <button class="s p hide" id="btnInstall">Install</button>
            <button
              class="s"
              id="btnGlass"
              aria-label="Ganti mode glass penuh atau ringan"
              title="Glass penuh / ringan"
            >
              ✦
            </button>
            <button class="s" id="btnOut">Keluar</button>
          </div>
        </header>

        <div id="backdrop" class="hide"></div>
        <div class="card" id="formCard">
          <b id="formTitle">Tambah pengerjaan</b>
          <div class="grid mt10">
            <div>
              <label for="f_date">Tanggal</label>
              <input id="f_date" type="date" />
            </div>
            <div>
              <label for="f_pr">PR</label>
              <input
                id="f_pr"
                placeholder="MW 2 125"
                autocapitalize="characters"
              />
            </div>
            <div>
              <label for="f_item">Ukuran item</label>
              <input
                id="f_item"
                placeholder="16.37 x 117.06"
                inputmode="text"
              />
            </div>
            <div>
              <label for="f_qty">Qty (pcs)</label>
              <input id="f_qty" type="number" min="1" value="1" />
            </div>
            <div>
              <label for="f_start">Mulai</label>
              <div class="row">
                <input id="f_start" type="time" />
                <button
                  type="button"
                  class="s"
                  aria-label="Isi jam mulai sekarang"
                  onclick="nowTo('f_start')"
                >
                  Now
                </button>
              </div>
            </div>
            <div>
              <label for="f_end">Selesai</label>
              <div class="row">
                <input id="f_end" type="time" />
                <button
                  type="button"
                  class="s"
                  aria-label="Isi jam selesai sekarang"
                  onclick="nowTo('f_end')"
                >
                  Now
                </button>
              </div>
            </div>
            <div>
              <label for="f_cust">Customer</label>
              <div class="row">
                <select id="f_cust"></select>
                <button
                  type="button"
                  class="s"
                  aria-label="Tambah customer baru"
                  onclick="addMaster('customers')"
                >
                  +
                </button>
              </div>
            </div>
            <div>
              <label for="f_mach">Mesin</label>
              <div class="row">
                <select id="f_mach"></select>
                <button
                  type="button"
                  class="s"
                  aria-label="Tambah mesin baru"
                  onclick="addMaster('machines')"
                >
                  +
                </button>
              </div>
            </div>
          </div>
          <div class="mt10">
            <label for="f_notes">Catatan</label>
            <input id="f_notes" placeholder="opsional" />
          </div>
          <label for="f_chk" class="chk">
            <input id="f_chk" type="checkbox" />
            Perlu dicek (data ragu, hasil baca kertas)
          </label>
          <div class="row mt12">
            <button class="p" id="btnSave">Simpan</button>
            <button id="btnCancel" class="hide">Batal</button>
          </div>
        </div>

        <div class="card">
          <button
            type="button"
            id="btnFilter"
            class="fbtn"
            aria-expanded="false"
            aria-controls="filterBody"
          >
            <span>Filter<span id="fbadge"></span></span
            ><span class="ch">▸</span>
          </button>
          <div class="facc" id="filterBody">
            <div class="facc-in">
              <div class="grid">
                <div>
                  <label for="q">No. PR</label>
                  <input id="q" placeholder="mw 2 atau 123" />
                </div>
                <div>
                  <label for="fi">Ukuran item</label>
                  <input id="fi" placeholder="16.37 atau 117.06" />
                </div>
                <div>
                  <label for="d1">Dari</label>
                  <input id="d1" type="date" />
                </div>
                <div>
                  <label for="d2">Sampai</label>
                  <input id="d2" type="date" />
                </div>
                <div>
                  <label for="fc">Customer</label>
                  <select id="fc"></select>
                </div>
                <div>
                  <label for="fm">Mesin</label>
                  <select id="fm"></select>
                </div>
                <div>
                  <label for="fk">Cek</label>
                  <select id="fk">
                    <option value="">Semua</option>
                    <option value="1">Perlu dicek</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div class="row wrap mt10">
            <button id="btnReset">Reset</button>
            <button id="btnCsv">Export CSV</button>
            <button id="btnOkAll" class="p">OK semua</button>
          </div>
          <div class="mut mt8" id="sum"></div>
        </div>

        <div class="card tw">
          <table>
            <thead>
              <tr>
                <th></th>
                <th data-k="job_date">Tanggal<span class="ar"></span></th>
                <th data-k="pr_no">PR<span class="ar"></span></th>
                <th data-k="item_size">Item<span class="ar"></span></th>
                <th data-k="qty">Qty<span class="ar"></span></th>
                <th data-k="start_time">Mulai<span class="ar"></span></th>
                <th data-k="end_time">Selesai<span class="ar"></span></th>
                <th data-k="duration_min">Durasi<span class="ar"></span></th>
                <th title="Rata-rata waktu per pcs · pcs selesai/total">
                  Per pcs
                </th>
                <th data-k="customer_name">Customer<span class="ar"></span></th>
                <th data-k="machine_name">Mesin<span class="ar"></span></th>
                <th data-k="status">Status<span class="ar"></span></th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tb"></tbody>
          </table>
        </div>

        <div class="pager" id="pager">
          <button id="pgFirst" aria-label="Halaman pertama">«</button>
          <button id="pgPrev" aria-label="Halaman sebelumnya">‹</button>
          <span class="mut" id="pgInfo"></span>
          <button id="pgNext" aria-label="Halaman berikutnya">›</button>
          <button id="pgLast" aria-label="Halaman terakhir">»</button>
          <label for="pgSize" class="mut">Per halaman</label>
          <select id="pgSize">
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
